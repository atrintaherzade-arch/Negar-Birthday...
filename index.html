<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Secret</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f6fa;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .box {
      width: 85%;
      max-width: 360px;
      text-align: center;
    }

    .lock {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 27px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    p {
      color: #777;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #ddd8eb;
      cursor: pointer;
      font-size: 14px;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="lock">🔐</div>

    <h1>A little secret...</h1>

    <p>This page isn't for everyone.</p>

    <input id="password" type="password" placeholder="ENTER PASSWORD">

    <button onclick="unlock()">UNLOCK ✦</button>

    <p id="message"></p>

  </div>

  <script>
    function unlock() {

      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password === "2306") {

        message.textContent = "ACCESS GRANTED ✦";
        message.style.color = "#777";

      } else {

        message.textContent = "Hmm... wrong password 👀";
        message.style.color = "#999";

      }
    }
  </script>

</body>
</html>
