<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Negar ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f6fa;
      font-family: Arial, sans-serif;
      color: #36343d;
      text-align: center;
    }

    .page {
      width: 88%;
      max-width: 520px;
    }

    .small {
      font-size: 12px;
      color: #999;
      letter-spacing: 3px;
    }

    h1 {
      font-size: 38px;
      font-weight: 400;
      margin: 18px 0 12px;
    }

    .line {
      width: 50px;
      height: 1px;
      background: #d8d3e2;
      margin: 25px auto;
    }

    .text {
      color: #777;
      line-height: 1.9;
      font-size: 15px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    .card {
      padding: 16px;
      border-radius: 15px;
      background: #eeeaf5;
      color: #555;
      text-decoration: none;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .heart {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="small">A LITTLE PAGE FOR</div>

    <h1>Happy Birthday, Negar ♡</h1>

    <div class="line"></div>

    <p class="text">
      You found the little secret.
      <br>
      So... welcome to your tiny birthday corner.
    </p>

    <div class="cards">

      <div class="card">
        🎧 A little something to listen to
      </div>

      <div class="card">
        💌 A little message
      </div>

      <div class="card">
        ✦ One more secret
      </div>

    </div>

    <div class="heart">♡</div>

  </div>

</body>
</html>
