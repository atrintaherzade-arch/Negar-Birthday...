<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Secret</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f6fa;
      font-family: Arial, sans-serif;
      color: #36343d;
      text-align: center;
    }

    .box {
      width: 88%;
      max-width: 360px;
    }

    .lock {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      margin: 10px 0;
    }

    p {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      text-align: center;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #ddd8eb;
      color: #444;
      font-size: 14px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      min-height: 22px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="lock">🔐</div>

    <h1>A little secret...</h1>

    <p>This page isn't for everyone.</p>

    <input
      id="password"
      type="password"
      placeholder="ENTER PASSWORD"
    >

    <button onclick="unlock()">UNLOCK ✦</button>

    <p id="message"></p>

  </div>

  <script>
    function unlock() {
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password === "2306") {
        message.textContent = "ACCESS GRANTED ✦";

        setTimeout(function() {
          window.location.href = "birthday2.html";
        }, 500);

      } else {
        message.textContent = "Hmm... wrong password 👀";
      }
    }
  </script>

</body>
</html>
